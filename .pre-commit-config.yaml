repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter
        entry: bash -c "cd backend && PYTHONPATH=. import-linter lint"
        language: system
        pass_filenames: false
        types: [python]
