name: LBMS Continuous Delivery

on:
  push:
    branches:
      - main
      - master # Por si usas master en lugar de main


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Descargar código del repositorio
        uses: actions/checkout@v5

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: 🛠️ Instalar dependencias del Backend (Tests)
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-bdd httpx pytest-cov

      - name: 🛠️ Instalar dependencias del Frontend
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: 🧪 Ejecutar tests del Frontend
        working-directory: ./frontend
        run: npm run test -- --run

      - name: 🧪 Levantar Base de Datos para Tests (Backend)
        run: |
          docker run -d \
            --name test_db \
            -e POSTGRES_USER=test_user \
            -e POSTGRES_PASSWORD=test_password \
            -e POSTGRES_DB=test_db \
            -p 5432:5432 \
            postgres:16-alpine

          # Esperar a que PostgreSQL esté listo
          until docker exec test_db pg_isready -U test_user -d test_db; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done

      - name: 🧪 Ejecutar tests del Backend
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: python -m pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Descargar código del repositorio
        uses: actions/checkout@v5

      - name: 🔑 Configurar llave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: 🛡️ Agregar VPS a known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Sincronizar archivos al VPS
        run: |
          # Usamos rsync para copiar solo lo que cambió, ignorando archivos basura
          rsync -avz --progress \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'frontend/node_modules' \
            --exclude 'frontend/dist' \
            --exclude 'backend/app/__pycache__' \
            --exclude 'backend/.pytest_cache' \
            --exclude '.env' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/lbms

      - name: 🐳 Reconstruir y levantar Docker
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /opt/lbms && docker compose -f docker-compose.yml up -d --build"
