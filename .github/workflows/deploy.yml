name: LBMS Continuous Delivery

on:
  push:
    branches:
      - main
      - master # Por si usas master en lugar de main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 🔑 Configurar llave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: 🛡️ Agregar VPS a known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Sincronizar archivos al VPS
        run: |
          # Usamos rsync para copiar solo lo que cambió, ignorando archivos basura
          rsync -avz --progress \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'frontend/node_modules' \
            --exclude 'frontend/dist' \
            --exclude 'backend/app/__pycache__' \
            --exclude 'backend/.pytest_cache' \
            --exclude '.env' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/lbms

      - name: 🐳 Reconstruir y levantar Docker
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /opt/lbms && docker compose -f docker-compose.yml up -d --build"
